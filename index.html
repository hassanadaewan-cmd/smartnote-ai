<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartNote AI</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #fff0f7;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: auto;
    }

    h1 {
        text-align: center;
        color: #e45b9b;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 250px;
        padding: 15px;
        box-sizing: border-box;
        border: 2px solid #f3a6c8;
        border-radius: 12px;
        font-size: 16px;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 15px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #e85b9d;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #d94b8d;
    }

    .result {
        margin-top: 25px;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 10px #ddd;
    }

    .result h2 {
        color: #e45b9b;
    }

    .topic {
        margin-top: 20px;
        padding: 15px;
        background: #fff5fa;
        border-left: 5px solid #e85b9d;
        border-radius: 8px;
    }

    .topic h3 {
        color: #d94b8d;
        margin-top: 0;
    }

    .topic p {
        line-height: 1.8;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🌸 SmartNote AI 📚</h1>

    <div class="subtitle">
        ระบบผู้ช่วยสรุปบทเรียนอัจฉริยะ
    </div>

    <textarea id="inputText"
        placeholder="วางเนื้อหาบทเรียนที่นี่..."></textarea>

    <button onclick="summarize()">
        ✨ สรุปบทเรียน
    </button>

    <div class="result" id="result">
        <h2>📖 ผลการสรุป</h2>
        <p>ใส่เนื้อหาแล้วกดปุ่ม “สรุปบทเรียน”</p>
    </div>

</div>


<script>

function summarize() {

    const text = document.getElementById("inputText").value.trim();
    const result = document.getElementById("result");

    if (text === "") {
        result.innerHTML = `
            <h2>📖 ผลการสรุป</h2>
            <p>⚠️ กรุณาใส่เนื้อหาก่อนนะ</p>
        `;
        return;
    }

    /*
      แบ่งเนื้อหาออกเป็นย่อหน้า
      เพื่อไม่ให้สรุปออกมาสั้นเกินไป
    */

    let paragraphs = text
        .split(/\n+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

    let output = `
        <h2>📖 สรุปบทเรียน</h2>
    `;

    /*
      แสดงเนื้อหาเป็นหัวข้อ
    */

    paragraphs.forEach((paragraph, index) => {

        let title = "";

        if (index === 0) {
            title = "🌱 บทนำ";
        } 
        else if (paragraph.includes("โครงสร้าง")) {
            title = "🌿 โครงสร้างของพืช";
        }
        else if (paragraph.includes("สังเคราะห์")) {
            title = "☀️ การสังเคราะห์ด้วยแสง";
        }
        else if (paragraph.includes("ลำเลียง")) {
            title = "💧 การลำเลียงสาร";
        }
        else if (paragraph.includes("คายน้ำ")) {
            title = "🍃 การคายน้ำ";
        }
        else if (paragraph.includes("สืบพันธุ์")) {
            title = "🌸 การสืบพันธุ์ของพืช";
        }
        else {
            title = "📌 หัวข้อที่ " + (index + 1);
        }

        output += `
            <div class="topic">
                <h3>${title}</h3>
                <p>${paragraph}</p>
            </div>
        `;
    });

    result.innerHTML = output;
}

</script>

</body>
</html>
