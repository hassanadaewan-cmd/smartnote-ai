<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartNote AI</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff0f7;
    color: #333;
}

.container {
    width: 90%;
    max-width: 800px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #e84d91;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 250px;
    box-sizing: border-box;
    padding: 15px;
    border: 2px solid #f3a4c7;
    border-radius: 15px;
    font-size: 16px;
    resize: vertical;
    outline: none;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: #e84d91;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #d83d81;
}

.result {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #ddd;
}

.result h2 {
    color: #e84d91;
}

.summary {
    line-height: 1.9;
    font-size: 17px;
}

.info {
    color: #888;
    font-size: 14px;
    margin-top: 15px;
}

</style>

</head>


<body>

<div class="container">

    <h1>🌸 SmartNote AI 📚</h1>

    <div class="subtitle">
        ระบบผู้ช่วยสรุปบทเรียนอัจฉริยะ
    </div>

    <textarea
        id="inputText"
        placeholder="วางเนื้อหาบทเรียนที่ต้องการสรุปที่นี่...">
    </textarea>

    <button onclick="summarize()">
        ✨ สรุปบทเรียน
    </button>

    <div class="result">

        <h2>📖 ผลการสรุป</h2>

        <div id="output" class="summary">
            ผลสรุปจะแสดงตรงนี้
        </div>

        <div id="info" class="info"></div>

    </div>

</div>


<script>

function summarize() {

    const text = document
        .getElementById("inputText")
        .value
        .trim();

    const output = document.getElementById("output");
    const info = document.getElementById("info");

    if (text === "") {

        output.innerHTML =
            "⚠️ กรุณาใส่เนื้อหาบทเรียนก่อน";

        info.innerHTML = "";

        return;
    }


    // แบ่งข้อความออกเป็นประโยค

    let sentences = text
        .replace(/\n+/g, " ")
        .split(/(?<=[.!?。！？])|(?<=\s)/)
        .map(s => s.trim())
        .filter(s => s.length > 20);


    /*
    ถ้าแบ่งประโยคไม่ได้
    จะใช้การแบ่งตามเครื่องหมาย
    */

    if (sentences.length < 3) {

        sentences = text
            .split(/[.!?。！？]/)
            .map(s => s.trim())
            .filter(s => s.length > 20);

    }


    // จำนวนประโยคทั้งหมด

    const total = sentences.length;


    /*
    สร้างคะแนนให้แต่ละประโยค
    โดยดูจากคำที่ปรากฏบ่อย
    */

    let words = text
        .toLowerCase()
        .replace(/[^\u0E00-\u0E7Fa-zA-Z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(w => w.length > 2);


    let frequency = {};

    words.forEach(word => {

        frequency[word] =
            (frequency[word] || 0) + 1;

    });


    /*
    คำที่ไม่ควรนำมาคิดคะแนน
    */

    const stopWords = [

        "และ",
        "หรือ",
        "ของ",
        "ที่",
        "เป็น",
        "มี",
        "ได้",
        "ใน",
        "จาก",
        "โดย",
        "กับ",
        "การ",
        "ให้",
        "แล้ว",
        "นั้น",
        "ซึ่ง",
        "ทำให้",
        "อย่าง",
        "เพื่อ",
        "สามารถ",
        "อีก"

    ];


    /*
    คำนวณคะแนนของแต่ละประโยค
    */

    let scored = sentences.map((sentence, index) => {

        let score = 0;

        let sentenceWords = sentence
            .toLowerCase()
            .replace(/[^\u0E00-\u0E7Fa-zA-Z0-9\s]/g, " ")
            .split(/\s+/);


        sentenceWords.forEach(word => {

            if (
                word.length > 2 &&
                !stopWords.includes(word)
            ) {

                score += frequency[word] || 0;

            }

        });


        /*
        เพิ่มคะแนนให้ประโยคที่อยู่ช่วงต้น
        เพราะมักเป็นใจความสำคัญ
        */

        if (index < 2) {
            score += 2;
        }


        /*
        เพิ่มคะแนนให้ประโยคที่มีคำสำคัญ
        */

        const importantWords = [

            "คือ",
            "หมายถึง",
            "สำคัญ",
            "สาเหตุ",
            "หน้าที่",
            "ประกอบด้วย",
            "ได้แก่",
            "มีความสำคัญ",
            "ทำหน้าที่",
            "เกิดจาก"

        ];


        importantWords.forEach(word => {

            if (sentence.includes(word)) {
                score += 3;
            }

        });


        return {
            sentence: sentence,
            score: score,
            index: index
        };

    });


    /*
    เลือกจำนวนประโยคสำหรับสรุป

    เนื้อหาสั้น → สรุปประมาณครึ่งหนึ่ง
    เนื้อหายาว → สรุปประมาณ 30-40%
    */

    let keep;

    if (total <= 3) {
        keep = 1;
    }

    else if (total <= 6) {
        keep = Math.ceil(total * 0.5);
    }

    else if (total <= 10) {
        keep = Math.ceil(total * 0.4);
    }

    else {
        keep = Math.ceil(total * 0.3);
    }


    /*
    เรียงตามคะแนน
    */

    scored.sort((a, b) =>
        b.score - a.score
    );


    /*
    เลือกเฉพาะประโยคที่คะแนนสูงสุด
    */

    let selected = scored
        .slice(0, keep);


    /*
    เรียงกลับตามลำดับเดิม
    เพื่อให้อ่านรู้เรื่อง
    */

    selected.sort((a, b) =>
        a.index - b.index
    );


    /*
    รวมเป็นข้อความสรุป
    */

    let summary = selected
        .map(item => item.sentence)
        .join(" ");


    /*
    แสดงผล
    */

    output.innerHTML = `
        <strong>สรุปเนื้อหา</strong><br><br>
        ${summary}
    `;


    /*
    แสดงข้อมูลว่า
    ลดข้อความไปเท่าไร
    */

    const originalLength = text.length;
    const summaryLength = summary.length;

    const percent = Math.max(
        0,
        Math.round(
            (1 - summaryLength / originalLength) * 100
        )
    );


    info.innerHTML =
        `📌 จากข้อความ ${originalLength} ตัวอักษร 
        เหลือประมาณ ${summaryLength} ตัวอักษร 
        (ลดลง ${percent}%)`;

}

</script>

</body>

</html>
