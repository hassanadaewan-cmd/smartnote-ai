<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Note AI</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f9f9f9; }
    textarea { width: 100%; height: 150px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 10px; background-color: #e85d9e; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:active { transform: scale(0.98); }
    #result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <h2>Smart Note AI - ระบบช่วยสรุปบทเรียน</h2>
  <textarea id="lesson" placeholder="วางเนื้อหาบทเรียนที่ต้องการสรุปที่นี่..."></textarea>
  <button onclick="summarize()">✨ สรุปเนื้อหา</button>

  <div id="result">
    <h2>📚 ผลสรุป</h2>
    <p style="color: #888;">ผลการสรุปจะแสดงที่นี่...</p>
  </div>

  <script>
  function summarize(){
    const text = document.getElementById("lesson").value.trim();
    const result = document.getElementById("result");

    if(!text){
      alert("กรุณาใส่เนื้อหาก่อนนะ 💗");
      return;
    }

    // ตัดข้อความตามความยาว (ท่อนละประมาณ 120 ตัวอักษร)
    const chunkSize = 120;
    const chunks = [];
    
    for (let i = 0; i < text.length && chunks.length < 5; i += chunkSize) {
      chunks.push(text.slice(i, i + chunkSize));
    }

    let htmlOutput = "<h2>📚 ผลสรุป</h2><ul>";
    chunks.forEach(chunk => {
      htmlOutput += `<li>🌱 ${chunk}...</li>`;
    });
    htmlOutput += "</ul>";

    result.innerHTML = htmlOutput;
  }
  </script>

</body>
</html>
